<!DOCTYPE html5>
<html lang="de">
	<head>
		<style>
        @import url('https://fonts.googleapis.com/css2?family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&display=swap');
        </style>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="style.css">
		<title>ESA06: Objekte bewegen - fliegende Kugeln</title>
		<script src="../src/gl-matrix.js"></script>
		<script src="vertexData.js"></script>
		<script src="app.js"></script>
		<script type="x-shader/x-vertex" id="vertexshader">
			attribute vec3 aPosition;
			// attribute vec3 aNormal;
			attribute vec4 aColor;

			uniform mat4 uPMatrix;
			uniform mat4 uMVMatrix;

			varying vec4 vColor;

			void main(){
				gl_Position = uPMatrix * uMVMatrix * vec4(aPosition, 1.0);
	
				vColor = aColor;
			}
		</script>
		<script type="x-shader/x-fragment" id="fragmentshader">
			precision mediump float;
			varying vec4 vColor;

			void main() {
				gl_FragColor = vColor;
			}
		</script>
	</head>
	<body onload="app.start()">
		<main>
			<h1>ESA06: Objekte bewegen - fliegende Kugeln</h1>
			<canvas id="canvas" width="700" height="700"></canvas>
			<p>Magisches Artefakt</p>
            <a id="back" href="../index.html">Zurück zur Übersicht</a>
			<footer>
                <p>Diese Seite ist im Zuge des VFH-Kurses "Graphical Visualisation Technologies" entstanden.</p>
                <p>Erstellt von Philipp Becker</p>
            </footer>
		</main>
		
	</body>
</html>
